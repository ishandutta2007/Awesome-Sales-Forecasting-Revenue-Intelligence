<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1933" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Inline Styles for Animation -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -400; }
      }
      @keyframes scanline {
        0% { transform: translateY(-30px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(380px); opacity: 0; }
      }

      .floating-pill { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card { animation: floatReverse 7s ease-in-out infinite; }
      .pulse-line { animation: pulseBeam 4s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 12 8; animation: dashAnim 15s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint / Grid Lines in Background -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="780" y1="0" x2="780" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1140" y1="0" x2="1140" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic / Animated Revenue & Sales Forecasting Flow (Background Graphics) -->
  <g class="pulse-line" opacity="0.6">
    <!-- Area Chart Gradient -->
    <path d="M 550,290 Q 680,240 760,260 T 940,170 T 1150,110 L 1150,340 L 550,340 Z" fill="url(#trendGrad)" />
    <!-- Dynamic Animated Forecast Stream Line -->
    <path class="stream-line" d="M 550,290 Q 680,240 760,260 T 940,170 T 1150,110" fill="none" stroke="url(#lineGlow)" stroke-width="4" filter="url(#glow)" />
  </g>

  <!-- Ambient Light Orbs (Deep Background) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="180" r="160" fill="#6366f1" opacity="0.1" filter="url(#glow)" />
  <circle cx="850" cy="300" r="110" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Metric Card Right (Dynamic Element Behind Title) -->
  <g class="floating-card" transform="translate(860, 50)" filter="url(#cardShadow)">
    <rect width="280" height="110" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" fill-opacity="0.85" />
    <circle cx="35" cy="40" r="16" fill="#10b981" fill-opacity="0.2" />
    <path d="M 28,40 L 33,45 L 42,35" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="65" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">PREDICTED QUOTA</text>
    <text x="65" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">$18.4M</text>
    <text x="65" y="90" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">▲ +32.4% AI Accuracy (R² 0.94)</text>
  </g>

  <!-- Animated Metric Card Bottom Right (Dynamic Element) -->
  <g class="floating-pill" transform="translate(800, 195)" filter="url(#cardShadow)">
    <rect width="340" height="95" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" fill-opacity="0.85" />
    <circle cx="35" cy="40" r="16" fill="#6366f1" fill-opacity="0.2" />
    <path d="M 27,45 L 34,34 L 43,41" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="65" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CONVERSATION SIGNALS</text>
    <text x="65" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">4,820 Calls Analyzed</text>
    <text x="65" y="82" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Deal Slippage Risk Reduced by 41%</text>
  </g>

  <!-- Foreground Category Pills (Left Top) -->
  <g class="floating-pill" transform="translate(80, 52)">
    <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="28" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">REVENUE INTELLIGENCE</text>
  </g>
  <g class="floating-pill" transform="translate(275, 52)">
    <rect width="165" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4.5" fill="#818cf8" />
    <text x="28" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SALES FORECASTING</text>
  </g>

  <!-- FOREGROUND HERO TYPOGRAPHY (Always in crisp foreground) -->
  <g transform="translate(80, 145)">
    <!-- Main Title -->
    <text x="0" y="0" fill="url(#primaryAccent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Sales Forecasting
    </text>
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-1">
      &amp; Revenue Intelligence
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The authoritative ecosystem guide to ML pipeline models, AI conversation analytics &amp; RevOps platforms.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚡ Predictive Pipeline Models</text>
      <text x="220" y="0" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🎯 Win/Loss Signal Extraction</text>
      <text x="450" y="0" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">📊 Self-Hosted BI Dashboards</text>
    </g>
  </g>
</svg>
